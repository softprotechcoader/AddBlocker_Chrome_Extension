<!DOCTYPE html>
<html>
<head>
  <title>AdRemover</title>
  <style>
    body {
      width: 300px;
      font-family: Arial, sans-serif;
      padding: 10px;
    }
    h1 {
      font-size: 18px;
      color: #4285f4;
      text-align: center;
    }
    .status {
      margin: 10px 0;
      padding: 10px;
      background-color: #e8f0fe;
      border-radius: 4px;
      text-align: center;
    }
    .status.enabled {
      background-color: #d2f8d2;
      color: #0d652d;
    }
    .status.disabled {
      background-color: #fad2d2;
      color: #8a1313;
    }
    .toggle-container {
      display: flex;
      justify-content: center;
      margin: 15px 0;
    }
    .toggle {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 34px;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 34px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 26px;
      width: 26px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #4285f4;
    }
    input:checked + .slider:before {
      transform: translateX(26px);
    }
    .stats {
      margin-top: 15px;
      font-size: 14px;
    }
    .footer {
      margin-top: 15px;
      font-size: 12px;
      color: #777;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>AdRemover</h1>
  <div id="statusBox" class="status enabled">Ad blocking is enabled</div>
  
  <div class="toggle-container">
    <label class="toggle">
      <input type="checkbox" id="adBlockToggle" checked>
      <span class="slider"></span>
    </label>
  </div>
  
  <div class="stats">
    <div>Ads blocked today: <span id="adsBlockedToday">0</span></div>
    <div>Ads blocked total: <span id="adsBlockedTotal">0</span></div>
  </div>
  
  <div class="footer">
    <p>AdRemover blocks ads on all websites including YouTube</p>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
